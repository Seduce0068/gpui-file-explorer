[package]
name = "gpui-file-explorer-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPUI-free core logic for gpui-file-explorer"
repository = "https://github.com/Seduce0068/gpui-file-explorer"

[lib]
name = "gfe_core"
path = "src/lib.rs"

[dependencies]
# app/Cargo.toml とバージョンを揃える（新規依存は追加していない）。
alphanumeric-sort = "1.5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
