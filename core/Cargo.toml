# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "gpui-file-explorer-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPUI-free core logic for gpui-file-explorer"
repository = "https://github.com/Seduce0068/gpui-file-explorer"

[lib]
name = "gfe_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
# wasm-opt 0.x bundled with wasm-pack rejects the generated module
# ("error validating input"); skip it. The unoptimized wasm still works.
wasm-opt = false

[dependencies]
# app/Cargo.toml とバージョンを揃える（新規依存は追加していない）。
alphanumeric-sort = "1.5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }

# model.rs のテストが serde_json を使うため、一般依存ではなく dev 依存に置く。
[dev-dependencies]
serde_json = "1"

# wasm32 向けバインディング専用。0.2.130 は Cargo.lock に既存のため新規取得不要。
[target.'cfg(target_family = "wasm")'.dependencies]
serde_json = "1"
wasm-bindgen = "0.2.130"
