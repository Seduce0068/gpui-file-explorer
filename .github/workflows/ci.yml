# SPDX-License-Identifier: AGPL-3.0-or-later
# 個人リポジトリ共通の再利用可能ワークフロー（rust-gates.yml）へ委譲する。
# ゲート: fmt → check → test → clippy → cargo audit → poc/ の追加ゲート。
# GPUI 系のビルドに必要な Linux 開発パッケージのみ導入する。
#
# 共有ワークフローには cargo-deny / cargo-vet 用の入力が無いため
# （2026-11 時点）、サプライチェーン監査のみ別ジョブで実行する。
# 共通ワークフロー側に入力が追加された場合は委譲して本ジョブを削除する。
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    # 共有ワークフローは実アカウント名（旧 onoderakeita からリネーム済み）で参照する。
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      working_directory: app
      apt_packages: |
        pkg-config
        libfontconfig-dev
        libfreetype-dev
        libxkbcommon-dev
        libxkbcommon-x11-dev
        libwayland-dev
        libx11-xcb-dev
      audit: true
      # virtual workspace（core/app/poc/win32）のうち、共有ワークフローの
      # gates は app/ のみ。残りは extra_gates で明示的に回す。
      extra_gates: |
        # release 固有の #[cfg(not(debug_assertions))] 分岐を検証する
        cargo check --release --all-targets --locked
        cargo test --release --all-targets --locked
        # core / win32 の単体テストをゲートへ戻す
        cargo test -p gpui-file-explorer-core --all-targets --locked
        cargo clippy -p gpui-file-explorer-core --all-targets --locked -- -D warnings
        cargo test -p gfe-win32 --all-targets --locked
        (cd ../poc && cargo fmt --all -- --check)
        (cd ../poc && cargo check --all-targets --locked)
        (cd ../poc && cargo test --all-targets --locked)
        (cd ../poc && cargo clippy --all-targets --locked -- -D warnings)

  supply-chain:
    name: Supply-chain audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 監査ツールの導入
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          # cargo-audit は gates ジョブ（audit: true）で実行済み。
          tool: |
            cargo-deny
            cargo-vet

      - name: 依存監査（cargo deny / app）
        working-directory: app
        run: cargo deny check

      - name: 依存監査（cargo deny / poc）
        working-directory: poc
        # poc/ のルートクレートは Cargo.toml に license が無いため licenses は除外（deny.toml 参照）。
        run: cargo deny check

      # poc/ の脆弱性監査は上の cargo deny advisories で実施。cargo-audit は
      # gates ジョブ（app/、audit: true）のみで導入・実行するため、ここでは
      # 呼ばない（tool 未導入で exit 101 になる）。

      - name: 依存監査（cargo vet、store が存在する場合のみ）
        working-directory: app
        run: |
          set -euo pipefail
          if [ ! -f supply-chain/config.toml ]; then
            echo "::notice::app/supply-chain/config.toml が無いため cargo vet をスキップする（cargo vet init で有効化）。"
            exit 0
          fi
          cargo vet check
