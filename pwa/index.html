<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6feb" />
    <!-- manifest.webmanifest の SVG data URI を流用し favicon 404 を防ぐ -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%231f6feb'/%3E%3Cpath d='M36 56h48l14 18h58v76H36z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="gpui-file-explorer の core API を wasm 経由で表示する PWA ビューア"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
    <title>GFE Viewer</title>
  </head>
  <body>
    <header class="app-header">
      <h1>GFE Viewer</h1>
      <p id="status" class="status" role="status" aria-live="polite">初期化中…</p>
      <!-- SW 更新時に main.js が表示する再読込導線（BH02） -->
      <button id="update-reload" type="button" hidden>新しい版を読み込む</button>
    </header>

    <main class="app-main">
      <div class="controls">
        <label class="search-field">
          <span class="search-label">検索</span>
          <input
            id="search"
            type="search"
            placeholder="ファイル名で検索"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            autocorrect="off"
            enterkeyhint="search"
          />
        </label>
        <button id="pick-dir" type="button" hidden>フォルダを選択</button>
        <button
          id="select-mode"
          type="button"
          class="select-mode"
          aria-pressed="false"
        >選択モード</button>
      </div>

      <div class="controls select-actions" id="select-actions" hidden>
        <button id="select-all" type="button">すべて選択</button>
        <button id="select-range" type="button" aria-pressed="false">範囲選択</button>
        <button id="select-clear" type="button">選択を解除</button>
        <span id="select-count" class="select-count" aria-live="polite" aria-atomic="true"></span>
      </div>

      <div class="controls sort-controls">
        <label class="sort-field">
          <span class="sort-label">並び替え</span>
          <select id="sort-key">
            <option value="name">名前</option>
            <option value="kind">種類</option>
            <option value="size">サイズ</option>
            <option value="modified">更新日時</option>
          </select>
        </label>
        <label class="sort-field">
          <span class="sort-label">方向</span>
          <select id="sort-dir">
            <option value="asc">昇順</option>
            <option value="desc">降順</option>
          </select>
        </label>
      </div>

      <p id="mode-note" class="mode-note" hidden></p>

      <section aria-labelledby="list-heading">
        <h2 id="list-heading" class="list-heading">
          <span id="list-title">一覧</span>
          <span id="list-count" class="count"></span>
        </h2>
        <ul
          id="entry-list"
          class="entry-list"
          role="listbox"
          aria-labelledby="list-heading"
          aria-multiselectable="true"
        ></ul>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
