[package]
name = "gpui-file-explorer-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui-kit = "=0.9.1"

[profile.dev]
# GPUI + wgpu の debuginfo は巨大（target/ が 12GiB に膨張）。
# バックトレースは残しつつ行テーブルのみに抑制する。
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
