# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "gpui-file-explorer"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
description = "A cross-platform file explorer prototype built with GPUI (gpui-kit)"
repository = "https://github.com/Seduce0068/gpui-file-explorer"
homepage = "https://github.com/Seduce0068/gpui-file-explorer"
readme = "README.md"

[dependencies]
gpui-kit = "=0.9.1"
alphanumeric-sort = "1.5"
notify = "8.2"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
async-channel = "2.5"
chrono = "0.4"
# Structured logging: `tracing` is already a transitive dependency via gpui;
# `tracing-subscriber` adds level/timestamp formatting and RUST_LOG filtering.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# `trash` 5.3.0 only builds where its platform backend exists. Its `os_limited`
# API is gated to Windows or Freedesktop Unix, and macOS / iOS / Android have
# no backend at all. Keep it out of those targets so the app compiles there;
# `app/src/trash_view.rs` provides matching no-op fallbacks. The gate mirrors
# the crate's own cfg (default `freedesktop` feature is enabled for the dep).
[target.'cfg(any(target_os = "windows", all(unix, not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android"))))'.dependencies]
trash = "5.3"

[profile.dev]
# GPUI + wgpu の debuginfo は巨大（debug=1 で 1.76GiB のバイナリ、target/ は 21GiB）。
# バックトレースは残しつつ行テーブルのみに抑制する。
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
